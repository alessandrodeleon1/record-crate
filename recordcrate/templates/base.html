{% load static %}
<!DOCTYPE html>
<html>
<head>
  <title>{% block title %}{% endblock %}</title>
  <link href="{% static 'css/recordcrate.css' %}" rel="stylesheet">
</head>
<body>

    <header>
        {% block nav %}
        <nav id="navbar">
            <ul>
                <li><a href="{% url 'recordcrate:homepage' %}">RecordCrate</a></li>
                <li><a href="{% url 'recordcrate:listings' %}">Listings</a></li>
                <!-- if logged in, show -->
                {% if user.is_authenticated %}
                    <li><a href="{% url 'recordcrate:user_profile' %}">Profile</a></li>
                    <li>
                    <form action="{% url 'recordcrate:logout' %}" method="POST">
                        {% csrf_token %}
                    <button>Logout</button>
                    </form>
                    </li>
                {% else %}
                <li><a href="{% url 'recordcrate:login' %}">Login</a></li>
                <li><a href="{% url 'recordcrate:register' %}">Register</a></li>
                {% endif %}

				<!--- TODO: needs more links--!>
			</ul>
        </nav>
        {% endblock nav %}
    </header>

  <div id="content">
    {% block content %}
    {% endblock %}
  </div>
</body>
</html>
